<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/lab.css" />
  </head>
  <body>
    <header>
      <h1>變數</h1>
    </header>
    <div class="container">
      <div>
        <p>電腦: <span id="computer"></span></p>
      </div>
      <div>
        <button class="btn" id="btnScissors">剪刀</button>
        <button class="btn" id="btnRock">石頭</button>
        <button class="btn" id="btnPaper">布</button>
      </div>
      <p id="resultP">請出拳</p>
      <p>贏: <span id="winCount"></span></p>
      <p>輸: <span id="loseCount"></span></p>
      <p>平手: <span id="tieCount"></span></p>
      <p>分數: <span id="score"></span></p>
      <button id="btnReset">重新開始</button>
    </div>
    <script src="scissorsrockpaper.js"></script>
  </body>
</html>
