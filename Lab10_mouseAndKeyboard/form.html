<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/lab.css" />
    <style>
      .inputCredit {
        width: 50px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Form 表單事件</h1>
    </header>
    <div class="container">
      <input type="text" id="input" placeholder="請輸入" />
      <hr />
      <label for="input1">信用卡號:</label>
      <input
        type="text"
        maxlength="4"
        class="inputCredit"
        placeholder="請輸入"
        name="input1"
      />
      <input
        type="text"
        maxlength="4"
        class="inputCredit"
        placeholder="請輸入"
      />
      <input
        type="text"
        maxlength="4"
        class="inputCredit"
        placeholder="請輸入"
      />
      <input
        type="text"
        maxlength="4"
        class="inputCredit"
        placeholder="請輸入"
      />
      <hr />
      <div>
        <label for="">
          身分證字號:
          <input type="text" name="" maxlength="10" id="inputID" />
          <span id="tResult"></span>
        </label>
      </div>
      <hr />
      <select name="" id="selectGroup">
        <option value="tpe">台北</option>
        <option value="ntp">新北</option>
        <option value="tyn">桃園</option>
      </select>
      <hr />
      <input type="radio" name="radioGroup" value="A" />A
      <input type="radio" name="radioGroup" value="B" />B
      <input type="radio" name="radioGroup1" value="C" />C
      <input type="radio" name="radioGroup1" value="D" />D
      <br />
      <button id="getRadioBtn">取得radio值</button>
      <button id="setRadioBtn">設定radio值</button>
      <hr />
      <input type="checkbox" value="1" name="checkboxGroup" id="" />1
      <input type="checkbox" value="2" name="checkboxGroup" id="" />2
      <input type="checkbox" value="3" name="checkboxGroup" id="" />3
      <br />
      <button id="getCheckboxBtn">取得Checkbox值</button>
      <button id="setCheckboxBtn">設定Checkbox值</button>
    </div>

    <script>
      //js code
      let input = document.getElementById("input");
      input.focus();
      /*
        focus
        blur
      */
      //focus
      input.addEventListener("focus", () => {
        console.log("focus");
      });

      //blur
      input.addEventListener("blur", () => {
        console.log("blur");
      });

      //Credit Card
      let inputCredits = document.getElementsByClassName("inputCredit");
      for (let i = 0; i < inputCredits.length; i++) {
        inputCredits[i].addEventListener("keyup", function () {
          this.value = this.value.replace(/[^0-9]/g, "");
          if (this.value.length == 4 && this.nextElementSibling !== null) {
            this.nextElementSibling.focus();
          }
        });
      }

      //blur practice
      let inputID = document.getElementById("inputID");
      let tResult = document.getElementById("tResult");
      inputID.addEventListener("blur", function () {
        let reg = new RegExp(/[A-Z][1289][0-9]{8}/);
        tResult.textContent = reg.test(this.value) ? "成功" : "失敗";
      });

      inputID.addEventListener("keydown", function (event) {
        console.log(`key:${event.key} keyCode:${event.keyCode}`);
        if (event.keyCode === 13) {
          inputID.blur();
        }
      });

      //change
      let selectGroup = document.getElementById("selectGroup");
      console.log(123);
      selectGroup.addEventListener("change", (e) => {
        console.log(e.target.value);
      });

      //取得radio值
      let getRadioBtn = document.getElementById("getRadioBtn");
      getRadioBtn.addEventListener("click", () => {
        let radioGroup = document.getElementsByName("radioGroup");
        let rResult = null;
        for (let radio of radioGroup) {
          if (radio.checked) {
            rResult = radio.value;
          }
        }
        console.log(rResult);
      });

      //設定radio值
      let setRadioBtn = document.getElementById("setRadioBtn");
      setRadioBtn.addEventListener("click", () => {
        setRadioValue("radioGroup", "A");
      });

      function setRadioValue(radioGroupName, valueName) {
        console.log(radioGroupName);
        let radioGroup = document.getElementsByName(radioGroupName);
        console.log(radioGroup);
        for (let radio of radioGroup) {
          radio.checked = radio.value === valueName;
        }
      }

      //取得checkbox value
      let getCheckboxBtn = document.getElementById("getCheckboxBtn");
      getCheckboxBtn.addEventListener("click", () => {
        let checkBoxGroup = document.getElementsByName("checkboxGroup");
        let result = new Array();
        for (let checkbox of checkBoxGroup) {
          if (checkbox.checked) {
            result.push(checkbox.value);
          }
        }
        console.log(result);
      });

      //設定checkbox value
      let setCheckboxBtn = document.getElementById("setCheckboxBtn");
      console.log(setCheckboxBtn);
      setCheckboxBtn.addEventListener("click", () => {
        let checkBoxGroup = document.getElementsByName("checkboxGroup");
        let values = ["1", "3"];
        checkBoxGroup.forEach((element) => {
          element.checked = values.indexOf(element.value) > -1;
        });
      });
    </script>
  </body>
</html>
